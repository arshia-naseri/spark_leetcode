<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spark LeetCode</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/comment/comment.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
</head>
<body>
  <!-- List page -->
  <div id="list-page" class="page" hidden>
    <header class="topbar">
      <a class="brand" href="/">⚡ Spark LeetCode</a>
    </header>
    <main class="list-main">
      <div class="list-tools">
        <input id="search" type="search" placeholder="Search questions" autocomplete="off">
        <div class="chips" id="diff-filter">
          <button data-diff="" class="chip active">All</button>
          <button data-diff="easy" class="chip">Easy</button>
          <button data-diff="medium" class="chip">Medium</button>
          <button data-diff="hard" class="chip">Hard</button>
        </div>
        <span id="count" class="muted"></span>
      </div>
      <div id="problem-list" class="problem-list"></div>
    </main>
  </div>

  <!-- Problem page -->
  <div id="problem-page" class="page" hidden>
    <header class="topbar">
      <a class="brand" href="/">⚡</a>
      <a class="nav-link" href="/">☰ Problem List</a>
      <div class="topbar-center">
        <div class="seg" id="method" title="Function to test">
          <button data-method="dataframe">DataFrame · solve()</button>
          <button data-method="sql">SQL · solve_sql()</button>
        </div>
        <button id="run" class="btn btn-run" title="Run tests (Ctrl/⌘ + Enter)">▶ Run</button>
      </div>
      <span class="spacer"></span>
    </header>
    <main class="workspace" id="workspace">
      <section class="panel" id="left">
        <div class="tabs">
          <button class="tab active" data-tab="description">📄 Description</button>
          <button class="tab" data-tab="solution">🧪 Solution</button>
        </div>
        <div class="panel-body" id="description"></div>
        <div class="panel-body" id="solution" hidden>
          <div id="solution-cover" class="cover">
            <p>The reference answer. Try the problem first.</p>
            <button id="reveal" class="btn">Show solution</button>
          </div>
          <div id="solution-code" hidden></div>
        </div>
      </section>
      <div class="gutter gutter-v" id="gutter-v"></div>
      <div class="column" id="right">
        <section class="panel" id="code-panel">
          <div class="tabs">
            <span class="tab active code-title">&lt;/&gt; Code</span>
            <span class="lang" id="lang">Python · practice_dataframe.py</span>
            <span class="spacer"></span>
            <button id="reset" class="icon-btn" title="Reset practice_dataframe.py to the template">↺</button>
          </div>
          <div class="panel-body editor-host" id="editor"></div>
          <div class="statusbar"><span id="save-state">Saved</span><span id="cursor"></span></div>
        </section>
        <div class="gutter gutter-h" id="gutter-h"></div>
        <section class="panel" id="test-panel">
          <div class="tabs">
            <button class="tab active" data-tab="testcase">☑ Testcase</button>
            <button class="tab" data-tab="result">&gt;_ Test Result</button>
          </div>
          <div class="panel-body" id="testcase"></div>
          <div class="panel-body" id="result" hidden></div>
        </section>
      </div>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
