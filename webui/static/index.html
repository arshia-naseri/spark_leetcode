<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spark LeetCode</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/comment/comment.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
</head>
<body>
  <!-- List page -->
  <div id="list-page" class="page" hidden>
    <header class="topbar">
      <a class="brand" href="/"><i data-lucide="zap"></i> Spark LeetCode</a>
      <span class="spacer"></span>
      <button class="icon-btn settings-btn" title="Spark settings"><i data-lucide="settings"></i></button>
    </header>
    <main class="list-main">
      <div class="list-tools">
        <input id="search" type="search" placeholder="Search questions" autocomplete="off">
        <div class="chips" id="diff-filter">
          <button data-diff="" class="chip active">All</button>
          <button data-diff="easy" class="chip">Easy</button>
          <button data-diff="medium" class="chip">Medium</button>
          <button data-diff="hard" class="chip">Hard</button>
        </div>
        <span id="count" class="muted"></span>
      </div>
      <div id="problem-list" class="problem-list"></div>
    </main>
  </div>

  <!-- Problem page -->
  <div id="problem-page" class="page" hidden>
    <header class="topbar">
      <a class="brand" href="/" title="Spark LeetCode"><i data-lucide="zap"></i></a>
      <a class="nav-link" href="/"><i data-lucide="list"></i> Problem List</a>
      <div class="topbar-center">
        <div class="seg" id="method" title="Function to test">
          <button data-method="dataframe">DataFrame · solve()</button>
          <button data-method="sql">SQL · solve_sql()</button>
        </div>
        <button id="run" class="btn btn-run" title="Run tests (Ctrl/⌘ + Enter)"><i data-lucide="play"></i> Run</button>
      </div>
      <span class="spacer"></span>
      <button class="icon-btn settings-btn" title="Spark settings"><i data-lucide="settings"></i></button>
    </header>
    <main class="workspace" id="workspace">
      <section class="panel" id="left">
        <div class="tabs">
          <button class="tab active" data-tab="description"><i data-lucide="file-text"></i> Description</button>
          <button class="tab" data-tab="solution"><i data-lucide="flask-conical"></i> Solution</button>
        </div>
        <div class="panel-body" id="description"></div>
        <div class="panel-body" id="solution" hidden>
          <div id="solution-cover" class="cover">
            <p>The reference answer. Try the problem first.</p>
            <button id="reveal" class="btn">Show solution</button>
          </div>
          <div id="solution-code" hidden></div>
        </div>
      </section>
      <div class="gutter gutter-v" id="gutter-v"></div>
      <div class="column" id="right">
        <section class="panel" id="code-panel">
          <div class="tabs">
            <span class="tab active code-title"><i data-lucide="code"></i> Code</span>
            <span class="lang" id="lang">Python · practice_dataframe.py</span>
            <span class="spacer"></span>
            <button id="reset" class="icon-btn" title="Reset practice_dataframe.py to the template"><i data-lucide="rotate-ccw"></i></button>
          </div>
          <div class="panel-body editor-host" id="editor"></div>
          <div class="statusbar"><span id="save-state">Saved</span><span id="cursor"></span></div>
        </section>
        <div class="gutter gutter-h" id="gutter-h"></div>
        <section class="panel" id="test-panel">
          <div class="tabs">
            <button class="tab active" data-tab="testcase"><i data-lucide="square-check"></i> Testcase</button>
            <button class="tab" data-tab="result"><i data-lucide="terminal"></i> Test Result</button>
          </div>
          <div class="panel-body" id="testcase"></div>
          <div class="panel-body" id="result" hidden></div>
        </section>
      </div>
    </main>
  </div>

  <!-- Spark settings -->
  <dialog id="settings" class="dialog">
    <form method="dialog" id="settings-form">
      <h2>Spark settings</h2>
      <p class="muted">These settings go to <code>SparkSession.builder.config()</code>. They apply to the next run and to <code>uv run pytest</code>. The file is <code>spark_config.json</code>.</p>
      <div id="settings-rows" class="settings-rows"></div>
      <button type="button" id="settings-add" class="btn"><i data-lucide="plus"></i> Add setting</button>
      <div id="settings-error" class="error-box" hidden></div>
      <div class="dialog-actions">
        <button type="button" id="settings-defaults" class="btn">Reset to defaults</button>
        <span class="spacer"></span>
        <button type="button" id="settings-cancel" class="btn">Cancel</button>
        <button type="submit" class="btn btn-run">Save</button>
      </div>
    </form>
  </dialog>

  <script src="/static/app.js"></script>
</body>
</html>
